[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbandwt-basics"
version = "0.1.0"
description = "A small M-channel cosine block transform experiment"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
license = {text = "MIT"}

[tool.setuptools]
py-modules = ["mbandwt"]
